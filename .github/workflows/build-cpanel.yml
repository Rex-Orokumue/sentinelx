name: Build for cPanel
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Used at build time to generate /sitemap.xml. Not copied into the output.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
          NEXT_PUBLIC_WHATSAPP_COMMUNITY_URL: ${{ secrets.NEXT_PUBLIC_WHATSAPP_COMMUNITY_URL }}
          NEXT_PUBLIC_ADMIN_WHATSAPP: ${{ secrets.NEXT_PUBLIC_ADMIN_WHATSAPP }}
          NEXT_PUBLIC_DISCORD_URL: ${{ secrets.NEXT_PUBLIC_DISCORD_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ secrets.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_YOUTUBE_URL: ${{ secrets.NEXT_PUBLIC_YOUTUBE_URL }}
          NEXT_PUBLIC_X_URL: ${{ secrets.NEXT_PUBLIC_X_URL }}
          NEXT_PUBLIC_TIKTOK_URL: ${{ secrets.NEXT_PUBLIC_TIKTOK_URL }}
          NEXT_PUBLIC_TELEGRAM_URL: ${{ secrets.NEXT_PUBLIC_TELEGRAM_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
        run: |
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SITE_URL SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!name}" ] || { echo "::error::Missing repository secret $name"; exit 1; }
          done
          # An unset secret arrives as "", which the app's `??` fallbacks don't catch.
          for name in $(compgen -e | grep '^NEXT_PUBLIC_'); do
            [ -n "${!name}" ] || unset "$name"
          done
          npm run build
      - run: bash scripts/cpanel/package.sh sentinelx-cpanel.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sentinelx-cpanel
          path: sentinelx-cpanel.tar.gz
          if-no-files-found: error
          # The repo is public and the build contains Next's generated keys.
          retention-days: 1
